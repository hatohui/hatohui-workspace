name: workspace-ci

on:
  pull_request:
    branches: [master]
    paths:
      - "apps/workspace/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "eslint.config.mjs"
      - ".prettierrc"
      - ".prettierignore"
      - ".github/workflows/workspace-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier
        run: bunx prettier --check apps/workspace

      - name: ESLint
        run: bunx eslint apps/workspace

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: apps/workspace
        run: bun run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
