name: ci

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: (cd apps/api && bunx prisma generate)
        env:
          DATABASE_URL: postgresql://root:root@localhost:5432/hatohui

      - name: Prettier
        run: bunx prettier --check apps packages

      - name: ESLint
        run: bunx eslint apps packages
