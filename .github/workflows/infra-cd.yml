name: infra-cd

on:
  push:
    branches: [master]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-cd.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Terraform init
        run: doppler run --project hatohui-workspace --config tf --name-transformer tf-var -- terraform init
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Terraform apply
        run: doppler run --project hatohui-workspace --config tf --name-transformer tf-var -- terraform apply -auto-approve
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
