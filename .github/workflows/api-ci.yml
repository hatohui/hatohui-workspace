name: api-ci

on:
  pull_request:
    branches: [master]
    paths:
      - "apps/api/**"
      - "packages/models/**"
      - "scripts/export-openapi.ts"
      - "package.json"
      - "bun.lock"
      - "eslint.config.mjs"
      - ".prettierrc"
      - ".prettierignore"
      - ".github/workflows/api-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://root:root@localhost:5432/hatohui

      - name: Prettier
        run: bunx prettier --check apps/api

      - name: ESLint
        run: bunx eslint apps/api

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://root:root@localhost:5432/hatohui

      - name: Build
        working-directory: apps/api
        run: bun run build
