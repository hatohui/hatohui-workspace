name: api-ci

on:
  pull_request:
    branches: [master]
    paths:
      - "apps/api/**"
      - "packages/models/**"
      - "scripts/export-openapi.ts"
      - "package.json"
      - "bun.lock"
      - "eslint.config.mjs"
      - ".prettierrc"
      - ".prettierignore"
      - ".github/workflows/api-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://root:root@localhost:5432/hatohui

      - name: Prettier
        run: bunx prettier --check apps/api

      - name: ESLint
        run: bunx eslint apps/api

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://root:root@localhost:5432/hatohui

      - name: Build
        working-directory: apps/api
        run: bun run build

  openapi-client:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: hatohui
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate OpenAPI client
        run: |
          (cd apps/api && bunx prisma generate)
          bun run scripts/export-openapi.ts
          bun run --cwd packages/models generate
        env:
          PORT: '3000'
          CORS_ORIGIN: http://localhost:5173
          DATABASE_URL: postgresql://root:root@localhost:5432/hatohui
          REDIS_URL: redis://localhost:6379
          GOOGLE_OAUTH_CLIENT_ID: ci-placeholder
          GOOGLE_OAUTH_CLIENT_SECRET: ci-placeholder
          SESSION_JWT_SECRET: ci-placeholder
          R2_BUCKET_NAME: ci-placeholder
          R2_ENDPOINT: http://localhost:9000
          R2_PUBLIC_URL: http://localhost:9000/ci-placeholder
          R2_ACCESS_KEY_ID: ci-placeholder
          R2_SECRET_ACCESS_KEY: ci-placeholder
          EMAIL_API_KEY: ci-placeholder
          ADMIN_API_KEY: ci-placeholder-admin-key

      - name: Fail if the committed client is stale
        run: |
          if ! git diff --exit-code -- packages/models/openapi.json packages/models/src/generated; then
            echo "::error::packages/models is out of date. Run 'task app:openapi:generate' and commit the diff."
            exit 1
          fi
