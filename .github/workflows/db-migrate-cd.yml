name: db-migrate-cd

on:
  push:
    branches: [master]
    paths:
      - "apps/api/prisma/schema.prisma"
      - ".github/workflows/db-migrate-cd.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: hatohui
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate migration if the schema changed
        id: generate
        working-directory: apps/api
        run: |
          bunx prisma migrate dev --name ci-auto
          if git status --porcelain -- prisma/migrations | grep -q .; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATABASE_URL: postgresql://root:root@localhost:5432/hatohui

      - name: Commit generated migration
        if: steps.generate.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/api/prisma/migrations
          git commit -m "chore(db): generate migration for schema change [skip ci]"
          git push

      - name: Apply migration to production
        if: steps.generate.outputs.created == 'true'
        working-directory: apps/api
        run: bunx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DB_URL }}
